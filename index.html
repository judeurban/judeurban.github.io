<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jessie & Jude — Urban Wedding Weekend</title>
<style>
  :root {
    --bg: #F5DE8B;          /* butter yellow */
    --bg-card: #FFF8E3;
    --maroon: #6B1423;      /* deep maroon */
    --maroon-2: #4E0E19;
    --ink: #3B1116;
    --ink-soft: #6E4650;
    --divider: rgba(107, 20, 35, 0.4);
    --shadow: rgba(59, 17, 22, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: "Times New Roman", Times, serif;
    line-height: 1.65;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .hero { text-align: center; padding: 1rem 0 1.75rem; }

  .hero h1 {
    font-weight: 700;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    margin: 0 0 0.35rem;
    color: var(--maroon);
  }

  .hero p.tagline {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 1.05rem;
    margin: 0;
  }

  .rule {
    border: none;
    border-top: 2px dotted var(--divider);
    margin: 1.75rem 0;
  }

  .welcome {
    text-align: center;
    color: var(--ink-soft);
    font-size: 1rem;
    margin: 0 0 1.75rem;
  }

  .lookup-card {
    background: var(--bg-card);
    border-radius: 14px;
    padding: 1.5rem 1.4rem;
    box-shadow: 0 10px 30px var(--shadow);
    border: 1px solid var(--divider);
  }

    display: block;
    font-size: 0.98rem;
    color: var(--ink-soft);
    margin-bottom: 0.6rem;
  }

  .lookup-row { display: flex; gap: 0.6rem; }

  button {
    font-family: "Times New Roman", Times, serif;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 0.75rem 1.1rem;
    border-radius: 8px;
    border: none;
    background: var(--maroon);
    color: #FFF8E3;
    cursor: pointer;
  }
  button:hover { background: var(--maroon-2); }

<body>
<div class="wrap">

  <div class="hero">
    <h1>Jessie &amp; Jude</h1>
    <p class="tagline">An urban wedding weekend &middot; October 9&ndash;11 &middot; Tulsa, Oklahoma</p>
  </div>

  <section class="thank-you-block" aria-labelledby="thank-you-title">
    <h2 id="thank-you-title">Thank You</h2>
    <div id="thankYou" class="thank-you-letter" aria-live="polite"></div>
    <p class="welcome-signoff">Jessie &amp; Jude</p>
  </section>

  <div class="lookup-card">
    <label for="guestSelect">What's your name?</label>
    <div class="lookup-row">
      <select id="guestSelect" aria-describedby="feedback">
        <option value="">Select your name</option>
      </select>
      <button id="findBtn">Find my weekend</button>
    </div>
    <div id="feedback"></div>
  </div>

  <div id="results"></div>

</div>

<script>
/* ------------------------------------------------------------------
   Guest data lives in people.csv, right next to this file.
   Invitation rules live in wedding_party.json.
------------------------------------------------------------------- */

let GUESTS = [];
let EVENTS = [];
let INVITATION_CONFIG = {};

function normalize(s) {
  return s.trim().toLowerCase().replace(/\s+/g, " ");
}

function lastName(name) {
  const nameParts = normalize(name).split(" ");
  return nameParts[nameParts.length - 1];
}

function parseCSV(text) {
  return text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0)
    .slice(1) // drop header row
    .map(line => {
      const [firstName, lastName, role] = line.split(",").map(s => s.trim());
      const name = [firstName, lastName].filter(Boolean).join(" ");
      return { name, role };
    })
    .filter(g => g.name && g.role);
}

async function loadGuests() {
  try {
    const res = await fetch("people.csv", { cache: "no-store" });
    if (!res.ok) throw new Error("people.csv not found");
    const text = await res.text();
    GUESTS = parseCSV(text).sort((left, right) => {
      const lastNameOrder = lastName(left.name).localeCompare(lastName(right.name));
      return lastNameOrder || left.name.localeCompare(right.name);
    });

    GUESTS.forEach(g => {
      const opt = document.createElement("option");
      opt.value = g.name;
      opt.textContent = g.name;
      document.getElementById("guestSelect").appendChild(opt);
    });
  } catch (err) {
    document.getElementById("feedback").innerHTML =
      '<span class="load-error">Couldn\'t load the guest list (people.csv). Make sure it\'s in the same folder as this page and that you\'re viewing it through GitHub Pages, not a local file.</span>';
  }
}

async function loadInvitationConfig() {
  const response = await fetch("wedding_party.json", { cache: "no-store" });
  if (!response.ok) throw new Error("wedding_party.json not found");
  INVITATION_CONFIG = await response.json();
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[character]));
}

function inlineMarkdown(value) {
  let html = escapeHtml(value);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
    '<img class="day-image" src="$2" alt="$1">');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

async function loadThankYou() {
  const response = await fetch("thank-you.md", { cache: "no-store" });
  if (!response.ok) throw new Error("thank-you.md not found");
  const text = await response.text();
  const paragraphs = text.trim().split(/\r?\n\s*\r?\n/);
  document.getElementById("thankYou").innerHTML = paragraphs
    .filter(paragraph => paragraph.trim())
    .map(paragraph => `<p>${inlineMarkdown(paragraph.replace(/\r?\n/g, " "))}</p>`)
    .join("");
}

function parseFrontMatter(text) {
  const match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  if (!match) throw new Error("Event markdown is missing front matter");

  const metadata = {};
  match[1].split(/\r?\n/).forEach(line => {
    const separator = line.indexOf(":");
    if (separator === -1) return;
    metadata[line.slice(0, separator).trim()] = line.slice(separator + 1).trim();
  });
  return { metadata, body: match[2] };
}

function markdownEvent(text, role, eventFile) {
  const { metadata, body } = parseFrontMatter(text);
  const eventKey = eventFile.replace(/\.md$/, "");
  const roleConfig = INVITATION_CONFIG.roles?.[role];
  if (!roleConfig || !roleConfig.events.includes(eventKey)) return null;

  const visibleLines = [];
  let roleBlock = false;
  let roleBlockAllowed = false;
  body.split(/\r?\n/).forEach(line => {
    const roleStart = line.match(/^<!-- roles: (.+) -->$/);
    if (roleStart) {
      roleBlock = true;
      roleBlockAllowed = roleStart[1].split(",").map(roleName => roleName.trim()).includes(role);
      return;
    }
    if (line.trim() === "<!-- /roles -->") {
      roleBlock = false;
      roleBlockAllowed = false;
      return;
    }
    if (!roleBlock || roleBlockAllowed) visibleLines.push(line);
  });

  let inDetails = false;
  let paragraph = [];
  const intro = [];
  const rows = [];
  const notes = [];
  const flushParagraph = () => {
    if (!paragraph.length) return;
    const html = `<p>${inlineMarkdown(paragraph.join(" "))}</p>`;
    (inDetails ? notes : intro).push(html);
    paragraph = [];
  };

  visibleLines.forEach(line => {
    if (line.trim() === "## Details") {
      flushParagraph();
      inDetails = true;
      return;
    }
    const row = line.match(/^[-*]\s+\*\*([^*]+):\*\*\s*(.+)$/);
    if (row && inDetails) {
      flushParagraph();
      rows.push({ label: row[1], value: inlineMarkdown(row[2]) });
      return;
    }
    if (!line.trim()) {
      flushParagraph();
      return;
    }
    if (line.trim().startsWith("![")) {
      flushParagraph();
      intro.push(inlineMarkdown(line.trim()));
      return;
    }
    paragraph.push(line.trim());
  });
  flushParagraph();

  return {
    ...metadata,
    introHtml: intro.join(""),
    rows,
    noteHtml: notes.join(""),
    variant: metadata.variant || "",
  };
}

function dayCard({ title, date, introHtml, rows, noteHtml, variant = "" }) {
  const imageMatch = introHtml.match(/<img class="day-image"[^>]+>/);
  const imageHtml = imageMatch ? imageMatch[0] : "";
  const textHtml = imageHtml ? introHtml.replace(imageHtml, "") : introHtml;
  const rowsHtml = rows.map(r => `
    <div class="detail-row">
      <span class="label">${r.label}</span>
      <span class="fill"></span>
      <span class="value">${r.value}</span>
    </div>`).join("");
  return `
    <div class="day-card ${variant}">
      <h2>${title}</h2>
      <p class="date">${date}</p>
      <div class="day-content">
        ${imageHtml}
        <div class="desc day-intro">${textHtml}</div>
      </div>
      <div class="details">
        <h3>Details</h3>
        ${rowsHtml}
        ${noteHtml ? `<div class="note">${noteHtml}</div>` : ""}
      </div>
    </div>`;
}

async function loadEvents() {
  const manifestResponse = await fetch("events/events.json", { cache: "no-store" });
  if (!manifestResponse.ok) throw new Error("events/events.json not found");
  const files = await manifestResponse.json();
  EVENTS = await Promise.all(files.map(async file => {
    const response = await fetch(`events/${file}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`${file} could not be loaded`);
    return { file, text: await response.text() };
  }));
}

function buildItinerary(role) {
  return EVENTS
    .map(event => markdownEvent(event.text, role, event.file))
    .filter(Boolean)
    .map(event => dayCard(event))
    .join("");
}

function buildOverview(role) {
  const rows = EVENTS
    .map(event => markdownEvent(event.text, role, event.file))
    .filter(Boolean)
    .map(event => `
      <div class="overview-row">
        <span class="overview-date"><strong>${escapeHtml(event.overviewDay)}</strong>, ${escapeHtml(event.overviewDate)}</span>
        <span class="overview-fill"></span>
        <span class="overview-title">${escapeHtml(event.overviewTitle)}</span>
      </div>`)
    .join("");

  return `
    <section class="overview" aria-labelledby="overview-title">
      <h2 id="overview-title">Overview</h2>
      ${rows}
    </section>`;
}

function render(guest) {
  const results = document.getElementById("results");
  const label = INVITATION_CONFIG.roles?.[guest.role]?.label || guest.role;

  results.innerHTML = `
    <hr class="rule">
    <p class="greeting">Hi ${guest.name}</p>
    <p class="greeting-sub">Here's your weekend &mdash; you're joining us as ${label}.</p>
    ${buildOverview(guest.role)}
    ${buildItinerary(guest.role)}
    <div class="reset-row"><button id="resetBtn">Look up a different name</button></div>
  `;
  document.getElementById("resetBtn").addEventListener("click", () => {
    results.innerHTML = "";
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").classList.remove("notfound");
    document.getElementById("guestSelect").selectedIndex = 0;
    document.getElementById("guestSelect").focus();
  });
}

function findGuest() {
  const select = document.getElementById("guestSelect");
  const feedback = document.getElementById("feedback");
  const query = normalize(select.value);

  if (!query) {
    feedback.textContent = "Type your name to get started.";
    feedback.classList.remove("notfound");
    return;
  }

  const match = GUESTS.find(g => normalize(g.name) === query);

  if (match) {
    feedback.textContent = "";
    feedback.classList.remove("notfound");
    render(match);
  } else {
    feedback.textContent = "We couldn't find that name on the list — double check the spelling, or reach out to Jessie or Jude directly.";
    feedback.classList.add("notfound");
    document.getElementById("results").innerHTML = "";
  }
}

document.getElementById("findBtn").addEventListener("click", findGuest);

Promise.all([loadGuests(), loadInvitationConfig(), loadEvents(), loadThankYou()]).catch(() => {
  document.getElementById("feedback").innerHTML =
    '<span class="load-error">Couldn\'t load the page content. Make sure people.csv, wedding_party.json, the events folder, and thank-you.md are published with this page.</span>';
});
</script>
</body>
</html>

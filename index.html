<body>
<div class="wrap">

  <div class="hero">
    <h1>Jessie &amp; Jude</h1>
    <p class="tagline">An urban wedding weekend &middot; October 9&ndash;11 &middot; Tulsa, Oklahoma</p>
  </div>

  <section class="thank-you-block" aria-labelledby="thank-you-title">
    <h2 id="thank-you-title">Thank You</h2>
    <div id="thankYou" class="thank-you-letter" aria-live="polite"></div>
    <p class="welcome-signoff">Jessie &amp; Jude</p>
  </section>

  <div class="lookup-card">
    <label for="guestSearch">Search your name</label>
    <div class="lookup-row">
      <input type="search" id="guestSearch" placeholder="Type at least 2 letters" autocomplete="off" autocapitalize="words" spellcheck="false" aria-describedby="lookupHint feedback">
      <select id="guestSelect" aria-label="Matching guest names" aria-describedby="feedback" hidden disabled>
        <option value="">Select your name</option>
      </select>
      <button id="findBtn" disabled>Find my weekend</button>
    </div>
    <p id="lookupHint" class="lookup-hint">Your name will appear after you start typing.</p>
    <div id="feedback"></div>
  </div>

  <div id="results"></div>

</div>

<script>
/* ------------------------------------------------------------------
   Guest data lives in people.csv, right next to this file.
   Invitation rules live in wedding_party.json.
------------------------------------------------------------------- */

let GUESTS = [];
let EVENTS = [];
let INVITATION_CONFIG = {};

function normalize(s) {
  return s.trim().toLowerCase().replace(/\s+/g, " ");
}

function lastName(name) {
  const nameParts = normalize(name).split(" ");
  return nameParts[nameParts.length - 1];
}

function parseCSV(text) {
  return text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0)
    .slice(1) // drop header row
    .map(line => {
      const [firstName, lastName, role] = line.split(",").map(s => s.trim());
      const name = [firstName, lastName].filter(Boolean).join(" ");
      return { name, role };
    })
    .filter(g => g.name && g.role);
}

async function loadGuests() {
  const resource = await fetchResource("people.csv");
  const text = await resource.response.text();
  GUESTS = parseCSV(text).sort((left, right) => {
    const lastNameOrder = lastName(left.name).localeCompare(lastName(right.name));
    return lastNameOrder || left.name.localeCompare(right.name);
  });
  updateGuestMatches();
}

function updateGuestMatches() {
  const search = document.getElementById("guestSearch");
  const select = document.getElementById("guestSelect");
  const button = document.getElementById("findBtn");
  const hint = document.getElementById("lookupHint");
  const query = normalize(search.value);
  const minimumCharacters = 2;

  select.replaceChildren(new Option("Select your name", ""));
  select.value = "";
  select.disabled = true;
  select.hidden = true;
  button.disabled = true;

  if (query.length < minimumCharacters) {
    hint.textContent = query.length === 0
      ? "Your name will appear after you start typing."
      : "Type one more character to search.";
    return;
  }

  const matches = GUESTS.filter(guest => normalize(guest.name).includes(query));
  matches.forEach(guest => select.appendChild(new Option(guest.name, guest.name)));
  select.disabled = matches.length === 0;
  select.hidden = matches.length === 0;
  hint.textContent = matches.length === 0
    ? "No matching names found. Check the spelling and try again."
    : `${matches.length} matching name${matches.length === 1 ? "" : "s"} found. Select yours below.`;

  // If only one matching name, auto-select it and render the results.
  if (matches.length === 1) {
    select.value = matches[0].name;
    select.disabled = false;
    select.hidden = false;
    // Trigger the change handler so the Find button is enabled.
    select.dispatchEvent(new Event("change", { bubbles: true }));
    // Immediately lookup and render the matched guest so the selection is shown.
    findGuest();
  }
}

async function fetchResource(path) {
  const url = new URL(path, document.baseURI).href;
  let response;
  try {
    response = await fetch(url, { cache: "no-store" });
  } catch (error) {
    throw new Error(`${path} failed to fetch (${error.message})`);
  }
  if (!response.ok) throw new Error(`${path} returned HTTP ${response.status} (${url})`);
  return { response, url };
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[character]));
}

function stripTags(html) {
  return html.replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
}

function pad(n, width=2) { return String(n).padStart(width, "0"); }
function formatIcsDate(dateIso, timeStr) {
  // Return a wall-clock local timestamp YYYYMMDDTHHMMSS (no timezone marker)
  // We'll emit DTSTART/DTEND with TZID=America/Chicago so calendar apps interpret as Central Time.
  if (!dateIso) return null;
  const timeMatch = (timeStr || "").match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM|am|pm)?/);
  let hh = 18, mm = 0; // default 6:00 PM
  if (timeMatch) {
    hh = parseInt(timeMatch[1], 10);
    mm = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
    const ampm = timeMatch[3];
    if (ampm) {
      const ap = ampm.toLowerCase();
      if (ap === 'pm' && hh !== 12) hh += 12;
      if (ap === 'am' && hh === 12) hh = 0;
    }
  }
  const d = new Date(`${dateIso}T00:00:00`);
  const YYYY = d.getFullYear();
  const MM = pad(d.getMonth() + 1);
  const DD = pad(d.getDate());
  return `${YYYY}${MM}${DD}T${pad(hh)}${pad(mm)}00`;
}

function icsEscape(text) {
  if (!text) return "";
  return String(text)
    .replace(/\r\n|\r|\n/g, "\\n")
    .replace(/([,;\\])/g, "\\$1");
}

// Given a wall-clock start timestamp YYYYMMDDTHHMMSS, return one 2 hours later (with date rollover).
function addTwoHours(dtstart) {
  const y = parseInt(dtstart.slice(0,4),10);
  let mo = parseInt(dtstart.slice(4,6),10);
  let day = parseInt(dtstart.slice(6,8),10);
  let hh = parseInt(dtstart.slice(9,11),10);
  const mm = parseInt(dtstart.slice(11,13),10);
  hh += 2;
  if (hh >= 24) {
    hh -= 24;
    day += 1;
    const norm = new Date(y, mo - 1, day);
    return `${norm.getFullYear()}${pad(norm.getMonth() + 1)}${pad(norm.getDate())}T${pad(hh)}${pad(mm)}00`;
  }
  return `${y}${pad(mo)}${pad(day)}T${pad(hh)}${pad(mm)}00`;
}

// Resolve dtstart/dtend wall-clock timestamps for an event, applying the same
// defaults used for single-event export (6:00 PM start, +2 hour end).
function resolveEventTimes({ dateIso, start, end }) {
  let dtstart = formatIcsDate(dateIso, start) || null;
  let dtend = formatIcsDate(dateIso, end) || null;
  if (!dtstart && dateIso) dtstart = formatIcsDate(dateIso, '6:00 PM');
  if (!dtend && dtstart) dtend = addTwoHours(dtstart);
  return { dtstart, dtend };
}

// Extract the fields needed to export a calendar event from a rendered day's event data.
function computeEventIcsFields(event) {
  const { title, date, rows, weatherDate, introHtml, noteHtml } = event;
  const imageMatch = introHtml.match(/<img class="day-image"[^>]+>/);
  const imageHtml = imageMatch ? imageMatch[0] : "";
  const textHtml = imageHtml ? introHtml.replace(imageHtml, "") : introHtml;

  const findRow = label => {
    const found = rows.find(r => r.label && r.label.toLowerCase().startsWith(label));
    return found ? stripTags(found.value) : "";
  };
  const startsTextCandidate = (labels) => {
    for (const l of labels) {
      const v = findRow(l);
      if (v) return v;
    }
    return "";
  };
  const parseTimesFromDateMeta = (metaDate) => {
    if (!metaDate) return { start: "", end: "" };
    const rangeMatch = metaDate.match(/(\d{1,2}(?::\d{2})?)(?:\s*(AM|PM|am|pm))?\s*[–—\-]\s*(\d{1,2}(?::\d{2})?)(?:\s*(AM|PM|am|pm))?/);
    if (rangeMatch) {
      let startRaw = rangeMatch[1].trim();
      const startAmpm = rangeMatch[2];
      let endRaw = rangeMatch[3].trim();
      const endAmpm = rangeMatch[4];
      if (!startAmpm && endAmpm) startRaw = `${startRaw} ${endAmpm}`;
      else if (startAmpm) startRaw = `${startRaw} ${startAmpm}`;
      if (endAmpm) endRaw = `${endRaw} ${endAmpm}`;
      return { start: startRaw.trim(), end: endRaw.trim() };
    }
    const singleMatch = metaDate.match(/(\d{1,2}(?::\d{2})?\s*(?:AM|PM|am|pm))/);
    if (singleMatch) return { start: singleMatch[1].trim(), end: "" };
    const startsMatch = metaDate.match(/starts?\s+(\d{1,2}(?::\d{2})?\s*(?:AM|PM|am|pm)?)/i);
    if (startsMatch) return { start: startsMatch[1].trim(), end: "" };
    return { start: "", end: "" };
  };

  const metaTimes = parseTimesFromDateMeta(date || "");
  const startsText = metaTimes.start || startsTextCandidate(['arrive', 'starts', 'when', 'rehearsal', 'start']) || "";
  const endsText = metaTimes.end || startsTextCandidate(['ends', 'ends:', 'dinner', 'ceremony', 'end']) || "";
  const whereText = findRow('where');
  const imageSrcMatch = imageHtml.match(/src=["']([^"']+)["']/);
  const attachUrl = imageSrcMatch ? new URL(imageSrcMatch[1], document.baseURI).href : "";
  const rowsText = rows.map(r => `${r.label}: ${stripTags(r.value)}`).join("\\n");
  const descriptionText = `${stripTags(textHtml)}${rowsText ? "\\n\\n" + rowsText : ""}${noteHtml ? "\\n\\n" + stripTags(noteHtml) : ""}`;

  return {
    title,
    dateIso: weatherDate || "",
    start: startsText,
    end: endsText,
    location: whereText,
    description: descriptionText,
    attach: attachUrl,
  };
}

// Build one VCALENDAR containing a VEVENT for every event the guest has access to.
function buildMultiIcsString(events) {
  const now = new Date();
  const dtstamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}`;
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//judeurban.github.io//EN'];
  events.forEach((event, index) => {
    const { dtstart, dtend } = resolveEventTimes(event);
    const uid = `${Date.now()}-${index}-${Math.random().toString(36).slice(2)}@judeurban.github.io`;
    lines.push('BEGIN:VEVENT', `UID:${uid}`, `DTSTAMP:${dtstamp}Z`);
    if (dtstart) lines.push(`DTSTART;TZID=America/Chicago:${dtstart}`);
    if (dtend) lines.push(`DTEND;TZID=America/Chicago:${dtend}`);
    if (event.title) lines.push(`SUMMARY:${icsEscape(event.title)}`);
    if (event.location) lines.push(`LOCATION:${icsEscape(event.location)}`);
    if (event.description) lines.push(`DESCRIPTION:${icsEscape(event.description)}`);
    lines.push(`URL:${document.baseURI}`);
    if (event.attach) lines.push(`ATTACH;FMTTYPE=image/jpeg:${event.attach}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function setupIcalButton(guestName) {
  const a = document.querySelector('.add-ical-all');
  if (!a) return;
  try {
    const events = JSON.parse(decodeURIComponent(a.dataset.events || '[]'));
    const ics = buildMultiIcsString(events);
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    a.href = url;
    const slug = (guestName || '').trim().replace(/[^a-z0-9]+/ig, '-').replace(/^-+|-+$/g, '');
    a.setAttribute('download', `wedding-weekend${slug ? `-${slug}` : ''}.ics`);
  } catch (e) {
    // noop
  }
}
// ---- Jeff Phillips binary easter-egg ----------------------------------
// Triggers when the looked-up guest name normalizes to "jeff phillips".
function enableBinaryEasterEgg() {
  if (window.__binaryEgg && window.__binaryEgg.active) return;
  window.__binaryEgg = { active: true, nodes: [], canvas: null, raf: null, exitBtn: null, _onKey: null, _onResize: null };

  // Walk text nodes (skip script/style/textarea/input/select) and replace with 8-bit ASCII binary
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const parent = node.parentNode && node.parentNode.nodeName;
      if (['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','INPUT','SELECT'].includes(parent)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);

  textNodes.forEach(n => {
    n._origText = n.nodeValue;
    n.nodeValue = Array.from(n._origText).map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
  });
  window.__binaryEgg.nodes = textNodes;

  // Apply page-level styling for the effect
  document.documentElement.style.backgroundColor = '#001100';
  document.body.style.color = '#00ff66';
  document.body.style.fontFamily = 'monospace';

  // Create a full-screen canvas to render falling binary (Matrix-style)
  const canvas = document.createElement('canvas');
  canvas.id = '__matrixCanvas';
  canvas.style.position = 'fixed';
  canvas.style.top = 0;
  canvas.style.left = 0;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.zIndex = 99999;
  canvas.style.pointerEvents = 'none';
  document.documentElement.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  let fontSize = Math.max(12, Math.floor((window.innerWidth || 800) / 120));
  let columns = 0;
  let drops = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    fontSize = Math.max(12, Math.floor((window.innerWidth || 800) / 120));
    columns = Math.floor(canvas.width / fontSize) + 1;
    drops = Array.from({ length: columns }, () => Math.random() * canvas.height / fontSize);
    ctx.font = `${fontSize}px monospace`;
  }

  function draw() {
    // translucent black for trail effect
    ctx.fillStyle = 'rgba(0,16,4,0.06)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff66';
    ctx.font = `${fontSize}px monospace`;
    for (let i = 0; i < columns; i++) {
      const text = Math.random() > 0.5 ? '1' : '0';
      const x = i * fontSize;
      const y = drops[i] * fontSize;
      ctx.fillText(text, x, y);
      drops[i] = (drops[i] + Math.random() * 0.9 + 0.4);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    }
    window.__binaryEgg.raf = requestAnimationFrame(draw);
  }

  window.__binaryEgg._onResize = resizeCanvas;
  window.addEventListener('resize', window.__binaryEgg._onResize);
  resizeCanvas();
  draw();
  window.__binaryEgg.canvas = canvas;

  // Add a small Exit button so Jeff can revert
  const btn = document.createElement('button');
  btn.id = '__matrixExitBtn';
  btn.textContent = 'Exit Matrix';
  btn.style.position = 'fixed';
  btn.style.right = '12px';
  btn.style.top = '12px';
  btn.style.zIndex = 100000;
  btn.style.background = 'transparent';
  btn.style.color = '#00ff66';
  btn.style.border = '1px solid rgba(0,255,102,0.12)';
  btn.style.padding = '6px 8px';
  btn.style.fontFamily = 'monospace';
  btn.style.cursor = 'pointer';
  btn.addEventListener('click', disableBinaryEasterEgg);
  document.body.appendChild(btn);
  window.__binaryEgg.exitBtn = btn;

  window.__binaryEgg._onKey = (e) => { if (e.key === 'Escape') disableBinaryEasterEgg(); };
  document.addEventListener('keydown', window.__binaryEgg._onKey);
}

function disableBinaryEasterEgg() {
  const state = window.__binaryEgg;
  if (!state) return;
  // restore text nodes
  (state.nodes || []).forEach(n => {
    if (n && n._origText !== undefined) {
      n.nodeValue = n._origText;
      delete n._origText;
    }
  });
  // remove canvas and controls
  if (state.raf) cancelAnimationFrame(state.raf);
  if (state.canvas && state.canvas.parentNode) state.canvas.parentNode.removeChild(state.canvas);
  if (state.exitBtn && state.exitBtn.parentNode) state.exitBtn.parentNode.removeChild(state.exitBtn);
  if (state._onResize) window.removeEventListener('resize', state._onResize);
  if (state._onKey) document.removeEventListener('keydown', state._onKey);
  // revert styles
  document.documentElement.style.backgroundColor = '';
  document.body.style.color = '';
  document.body.style.fontFamily = '';
  window.__binaryEgg = { active: false };
}

function isJeffPhillipsName(name) {

const WEATHER_CACHE = new Map();

const WEATHER_DESCRIPTIONS = {
  0: "Clear sky",
  1: "Mainly clear",
  2: "Partly cloudy",
  3: "Overcast",
  45: "Foggy",
  48: "Foggy",
  51: "Light drizzle",
  53: "Drizzle",
  55: "Heavy drizzle",
  61: "Light rain",
  63: "Rain",
  65: "Heavy rain",
  71: "Light snow",
  73: "Snow",
  75: "Heavy snow",
  80: "Light rain showers",
  81: "Rain showers",
  82: "Heavy rain showers",
  95: "Thunderstorms",
  96: "Thunderstorms with hail",
  99: "Thunderstorms with hail",
};

const WEATHER_ICONS = {
  clear: "☼",
  cloudy: "☁",
  rain: "☂",
  snow: "❄",
  storm: "⚡",
};

function weatherIcon(code) {
  if (code >= 95) return WEATHER_ICONS.storm;
  if (code >= 71 && code <= 77) return WEATHER_ICONS.snow;
  if (code >= 51 && code <= 82) return WEATHER_ICONS.rain;
  if (code >= 1 && code <= 3) return WEATHER_ICONS.cloudy;
  return WEATHER_ICONS.clear;
}

function formatTemperature(value) {
  return `${Math.round(value)}°F`;
}

function daysFromToday(date) {
  const today = new Date(`${new Date().toISOString().slice(0, 10)}T12:00:00Z`);
  const target = new Date(`${date}T12:00:00Z`);
  return Math.round((target - today) / 86400000);
}

// Errors in this class describe an expected, guest-friendly reason no forecast
// exists yet (too far out, or the date has passed) rather than a real failure.
class ForecastNotReadyError extends Error {}

async function getWeather(zip, date) {
  const cacheKey = `${zip}:${date}`;
  if (WEATHER_CACHE.has(cacheKey)) return WEATHER_CACHE.get(cacheKey);

  const daysAway = daysFromToday(date);
  if (daysAway < 0) throw new ForecastNotReadyError("Forecasts are no longer available for this date");
  // Open-Meteo's daily forecast covers today (offset 0) through offset 15 (16 days total).
  if (daysAway > 15) throw new ForecastNotReadyError("Forecast will be available closer to the event date");

  const geocodeUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(zip)}&count=1&language=en&format=json`;
  const geocodeResponse = await fetch(geocodeUrl, { cache: "no-store" });
  if (!geocodeResponse.ok) throw new Error("Location lookup unavailable");
  const geocode = await geocodeResponse.json();
  const location = (geocode && geocode.results && geocode.results[0]) || null;
  if (!location) throw new Error(`ZIP code ${zip} could not be located`);

  const params = new URLSearchParams({
    latitude: location.latitude,
    longitude: location.longitude,
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_gusts_10m_max",
    temperature_unit: "fahrenheit",
    wind_speed_unit: "mph",
    timezone: "auto",
    start_date: date,
    end_date: date,
  });
  const forecastResponse = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`, { cache: "no-store" });
  if (!forecastResponse.ok) throw new Error("Weather forecast unavailable");
  const forecast = await forecastResponse.json();
  const daily = forecast.daily;
  const weather = {
    icon: weatherIcon(daily && daily.weather_code && daily.weather_code[0]),
    description: WEATHER_DESCRIPTIONS[(daily && daily.weather_code && daily.weather_code[0])] || "Forecast available",
    high: formatTemperature(daily && daily.temperature_2m_max && daily.temperature_2m_max[0]),
    low: formatTemperature(daily && daily.temperature_2m_min && daily.temperature_2m_min[0]),
    rain: daily && daily.precipitation_probability_max && daily.precipitation_probability_max[0],
    gusts: daily && daily.wind_gusts_10m_max && daily.wind_gusts_10m_max[0],
  };
  WEATHER_CACHE.set(cacheKey, weather);
  return weather;
}

function weatherMarkup(event) {
  return `<div class="weather-strip is-pending" data-weather-date="${escapeHtml(event.weatherDate)}" data-weather-zip="${escapeHtml(event.weatherZip)}">Loading forecast...</div>`;
}

async function hydrateWeather() {
  const strips = document.querySelectorAll("[data-weather-date]");
  await Promise.all([...strips].map(async strip => {
    const date = strip.dataset.weatherDate;
    const zip = strip.dataset.weatherZip;
    try {
      const weather = await getWeather(zip, date);
      strip.classList.remove("is-pending");
      strip.innerHTML = `<span class="weather-icon" aria-hidden="true">${weather.icon}</span>${weather.description} · ${weather.high} / ${weather.low} · ${weather.rain}% chance of rain · gusts to ${Math.round(weather.gusts)} mph`;
    } catch (error) {
      strip.classList.remove("is-pending");
      strip.classList.add("is-unavailable");
      // Only expected "not ready yet" reasons get their specific message; any real
      // failure (network, geocoding, API) shows one consistent, friendly line.
      strip.textContent = error instanceof ForecastNotReadyError
        ? error.message
        : "Forecast unavailable right now. Please check again later.";
    }
  }));
}

function inlineMarkdown(value) {
  let html = escapeHtml(value);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
    '<img class="day-image" src="$2" alt="$1">');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

async function loadThankYou() {
  const resource = await fetchResource("thank-you.md");
  const text = await resource.response.text();
  const paragraphs = text.trim().split(/\r?\n\s*\r?\n/);
  document.getElementById("thankYou").innerHTML = paragraphs
    .filter(paragraph => paragraph.trim())
    .map(paragraph => `<p>${inlineMarkdown(paragraph.replace(/\r?\n/g, " "))}</p>`)
    .join("");
}

function parseFrontMatter(text) {
  const match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  if (!match) throw new Error("Event markdown is missing front matter");

  const metadata = {};
  match[1].split(/\r?\n/).forEach(line => {
    const separator = line.indexOf(":");
    if (separator === -1) return;
    metadata[line.slice(0, separator).trim()] = line.slice(separator + 1).trim();
  });
  return { metadata, body: match[2] };
}

function markdownEvent(text, role, eventFile) {
  const { metadata, body } = parseFrontMatter(text);
  const eventKey = eventFile.replace(/\.md$/, "");
  const roleConfig = (INVITATION_CONFIG.roles && INVITATION_CONFIG.roles[role]) || null;
  if (!roleConfig || !roleConfig.events.includes(eventKey)) return null;

  const visibleLines = [];
  let roleBlock = false;
  let roleBlockAllowed = false;
  body.split(/\r?\n/).forEach(line => {
    const roleStart = line.match(new RegExp("^" + "<" + "!-- roles: (.+) -->$"));
    if (roleStart) {
      roleBlock = true;
      roleBlockAllowed = roleStart[1].split(",").map(roleName => roleName.trim()).includes(role);
      return;
    }
    if (line.trim() === "<!-- /roles -->") {
      roleBlock = false;
      roleBlockAllowed = false;
      return;
    }
    if (!roleBlock || roleBlockAllowed) visibleLines.push(line);
  });

  let inDetails = false;
  let inMenu = false;
  let paragraph = [];
  const intro = [];
  const rows = [];
  const notes = [];
  const menuItems = [];
  const flushParagraph = () => {
    if (!paragraph.length) return;
    if (inMenu) menuItems.push(inlineMarkdown(paragraph.join(" ")));
    else {
      const html = `<p>${inlineMarkdown(paragraph.join(" "))}</p>`;
      (inDetails ? notes : intro).push(html);
    }
    paragraph = [];
  };

  visibleLines.forEach(line => {
    if (line.trim() === "## Details") {
      flushParagraph();
      inDetails = true;
      inMenu = false;
      return;
    }
    if (line.trim() === "## Menu") {
      flushParagraph();
      inDetails = false;
      inMenu = true;
      return;
    }
    if (inMenu) {
      const menuItem = line.match(/^\s*[-*]\s+(.+)$/);
      if (menuItem) {
        flushParagraph();
        menuItems.push(inlineMarkdown(menuItem[1]));
        return;
      }
    }
    const row = line.match(/^\s*[-*]\s+\*\*([^*]+):\*\*\s*(.+)$/);
    if (row && inDetails) {
      flushParagraph();
      rows.push({ label: row[1], value: inlineMarkdown(row[2]) });
      return;
    }
    if (!line.trim()) {
      flushParagraph();
      return;
    }
    if (line.trim().startsWith("![")) {
      flushParagraph();
      intro.push(inlineMarkdown(line.trim()));
      return;
    }
    paragraph.push(line.trim());
  });
  flushParagraph();

  return {
    ...metadata,
    introHtml: intro.join(""),
    rows,
    menuHtml: menuItems.length ? `<ul>${menuItems.map(item => `<li>${item}</li>`).join("")}</ul>` : "",
    noteHtml: notes.join(""),
    variant: metadata.variant || "",
  };
}

function dayCard({ title, date, introHtml, rows, menuHtml, noteHtml, variant = "", weatherDate, weatherZip }) {
  const imageMatch = introHtml.match(/<img class="day-image"[^>]+>/);
  const imageHtml = imageMatch ? imageMatch[0] : "";
  const textHtml = imageHtml ? introHtml.replace(imageHtml, "") : introHtml;

  const rowsHtml = rows.map(r => `
    <div class="detail-row">
      <span class="label">${r.label}</span>
      <span class="fill"></span>
      <span class="value">${r.value}</span>
    </div>`).join("");
  return `
    <div class="day-card ${variant}">
      <h2>${escapeHtml(title).replace(/\s*·\s*/g, '<br>')}</h2>
      <p class="date">${date}</p>
      <div class="day-content">
        ${imageHtml}
        <div class="desc day-intro">${textHtml}</div>
      </div>
      <div class="details">
        <h3>Details</h3>
        ${rowsHtml}
        ${menuHtml ? `<div class="menu-sub-block"><h4>Menu</h4>${menuHtml}</div>` : ""}
        <div class="weather-sub-block">
          <h4>Forecast</h4>
          ${weatherMarkup({ weatherDate, weatherZip })}
        </div>
        ${noteHtml ? `<div class="note">${noteHtml}</div>` : ""}
      </div>
    </div>`;
}

async function loadEvents() {
  const manifestResource = await fetchResource("events/events.json");
  const files = await manifestResource.response.json();
  EVENTS = await Promise.all(files.map(async file => {
    const resource = await fetchResource(`events/${file}`);
    return { file, text: await resource.response.text() };
  }));
}

function buildItinerary(role) {
  return EVENTS
    .map(event => markdownEvent(event.text, role, event.file))
    .filter(Boolean)
    .map(event => dayCard(event))
    .join("");
}

function buildOverview(role) {
  const events = EVENTS
    .map(event => markdownEvent(event.text, role, event.file))
    .filter(Boolean);

  const rows = events
    .map(event => `
      <div class="overview-row">
        <span class="overview-date"><strong>${escapeHtml(event.overviewDay)}</strong>, ${escapeHtml(event.overviewDate)}</span>
        <span class="overview-fill"></span>
        <span class="overview-title">${escapeHtml(event.overviewTitle)}</span>
      </div>`)
    .join("");

  const allEventsData = encodeURIComponent(JSON.stringify(events.map(computeEventIcsFields)));

  return `
    <section class="overview" aria-labelledby="overview-title">
      <h2 id="overview-title">Overview</h2>
      ${rows}
      <div class="overview-actions">
        <a class="add-ical add-ical-all" href="#"
          role="button"
          aria-label="Add wedding weekend to calendar"
          data-events="${allEventsData}"
        >
          <span class="ical-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M7 3v2M17 3v2M3 8h18M5 21h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <rect x="8.5" y="11" width="2" height="2" rx="0.3" fill="currentColor" />
              <rect x="12.5" y="11" width="2" height="2" rx="0.3" fill="currentColor" />
            </svg>
          </span>
          <span class="ical-label">Add Wedding Weekend to Calendar</span>
        </a>
      </div>
    </section>`;
}

function render(guest) {
  const results = document.getElementById("results");
  const label = (INVITATION_CONFIG.roles && INVITATION_CONFIG.roles[guest.role] && INVITATION_CONFIG.roles[guest.role].label) || guest.role;

  results.innerHTML = `
    <hr class="rule">
    <p class="greeting">Hi ${guest.name}</p>
    <p class="greeting-sub">Here's your weekend &mdash; you're joining us as ${label}.</p>
    ${buildOverview(guest.role)}
    ${buildItinerary(guest.role)}
    <div class="reset-row"><button id="resetBtn">Look up a different name</button></div>
  `;
  hydrateWeather();
  setupIcalButton(guest.name);
  document.getElementById("resetBtn").addEventListener("click", () => {
    results.innerHTML = "";
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").classList.remove("notfound");
    document.getElementById("guestSearch").value = "";
    document.getElementById("guestSelect").selectedIndex = 0;
    updateGuestMatches();
    document.getElementById("guestSearch").focus();
  });
}

function findGuest() {
  const select = document.getElementById("guestSelect");
  const feedback = document.getElementById("feedback");
  const query = normalize(select.value);

  if (!query) {
    feedback.textContent = "Type your name to get started.";
    feedback.classList.remove("notfound");
    return;
  }

  const match = GUESTS.find(g => normalize(g.name) === query);

  if (match) {
    feedback.textContent = "";
    feedback.classList.remove("notfound");
    render(match);
    // Easter-egg: if this guest is Jeff Phillips, enable the binary/Matrix effect
    try {
      if (isJeffPhillipsName(match.name)) {
        // small delay to let the page render before transforming text
        setTimeout(() => { enableBinaryEasterEgg(); }, 300);
      }
    } catch (e) {
      // noop — do not break guest rendering
    }
  } else {
    feedback.textContent = "We couldn't find that name on the list — double check the spelling, or reach out to Jessie or Jude directly.";
    feedback.classList.add("notfound");
    document.getElementById("results").innerHTML = "";
  }
}

document.getElementById("findBtn").addEventListener("click", findGuest);
document.getElementById("guestSearch").addEventListener("input", updateGuestMatches);
document.getElementById("guestSelect").addEventListener("change", (event) => {
  document.getElementById("findBtn").disabled = !event.target.value;
});

const contentLoaders = [
  ["Guest list", loadGuests],
  ["Invitation config", loadInvitationConfig],
  ["Event content", loadEvents],
  ["Thank-you letter", loadThankYou],
];

Promise.allSettled(contentLoaders.map(([, loader]) => loader())).then(results => {
  const failures = results
    .map((result, index) => result.status === "rejected" ? `${contentLoaders[index][0]}: ${result.reason.message}` : null)
    .filter(Boolean);
  if (failures.length) {
    document.getElementById("feedback").innerHTML = `
      <div class="load-error">
        <strong>Couldn't load the page content.</strong>
        <p>Deployment diagnostics:</p>
        <ul>${failures.map(failure => `<li>${escapeHtml(failure)}</li>`).join("")}</ul>
        <p>Confirm these files are published from the same GitHub Pages source as index.html.</p>
      </div>`;
  }
});
</script>
</body>
</html>

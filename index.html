<!DOCTYPE html>
<html lang="en">
<head>

<title>Jessie & Jude — Urban Wedding Weekend</title>
<style>

<body>
<div class="wrap">

  <div class="hero">
    <h1>Jessie &amp; Jude</h1>
    <p class="tagline">An urban wedding weekend &middot; October 9&ndash;11 &middot; Tulsa, Oklahoma</p>
  </div>

  <section class="thank-you-block" aria-labelledby="thank-you-title">
    <h2 id="thank-you-title">Thank You</h2>
    <div id="thankYou" class="thank-you-letter" aria-live="polite"></div>
    <p class="welcome-signoff">Jessie &amp; Jude</p>
  </section>

  <div class="lookup-card">
    <label for="guestSearch">Search your name</label>
    <div class="lookup-row">
      <input type="search" id="guestSearch" placeholder="Type at least 2 letters" autocomplete="off" autocapitalize="words" spellcheck="false" aria-describedby="lookupHint feedback">
      <select id="guestSelect" aria-label="Matching guest names" aria-describedby="feedback" hidden disabled>
        <option value="">Select your name</option>
      </select>
      <button id="findBtn" disabled>Find my weekend</button>
    </div>
    <p id="lookupHint" class="lookup-hint">Your name will appear after you start typing.</p>
    <div id="feedback"></div>
  </div>

  <div id="results"></div>

</div>

<script>
/* ------------------------------------------------------------------
   Guest data lives in people.csv, right next to this file.
   Invitation rules live in wedding_party.json.
------------------------------------------------------------------- */

let GUESTS = [];
let EVENTS = [];
let INVITATION_CONFIG = {};

function normalize(s) {
  return s.trim().toLowerCase().replace(/\s+/g, " ");
}

function lastName(name) {
  const nameParts = normalize(name).split(" ");
  return nameParts[nameParts.length - 1];
}

function parseCSV(text) {
  return text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0)
    .slice(1) // drop header row
    .map(line => {
      const [firstName, lastName, role] = line.split(",").map(s => s.trim());
      const name = [firstName, lastName].filter(Boolean).join(" ");
      return { name, role };
    })
    .filter(g => g.name && g.role);
}

async function loadGuests() {
  const resource = await fetchResource("people.csv");
  const text = await resource.response.text();
  GUESTS = parseCSV(text).sort((left, right) => {
    const lastNameOrder = lastName(left.name).localeCompare(lastName(right.name));
    return lastNameOrder || left.name.localeCompare(right.name);
  });
  updateGuestMatches();
}

function updateGuestMatches() {
  const search = document.getElementById("guestSearch");
  const select = document.getElementById("guestSelect");
  const button = document.getElementById("findBtn");
  const hint = document.getElementById("lookupHint");
  const query = normalize(search.value);
  const minimumCharacters = 2;

  select.replaceChildren(new Option("Select your name", ""));
  select.value = "";
  select.disabled = true;
  select.hidden = true;
  button.disabled = true;

  if (query.length < minimumCharacters) {
    hint.textContent = query.length === 0
      ? "Your name will appear after you start typing."
      : "Type one more character to search.";
    return;
  }

  const matches = GUESTS.filter(guest => normalize(guest.name).includes(query));
  matches.forEach(guest => select.appendChild(new Option(guest.name, guest.name)));
  select.disabled = matches.length === 0;
  select.hidden = matches.length === 0;
  hint.textContent = matches.length === 0
    ? "No matching names found. Check the spelling and try again."
    : `${matches.length} matching name${matches.length === 1 ? "" : "s"} found. Select yours below.`;
}

async function fetchResource(path) {
  const url = new URL(path, document.baseURI).href;
  let response;
  try {
    response = await fetch(url, { cache: "no-store" });
  } catch (error) {
    throw new Error(`${path} failed to fetch (${error.message})`);
  }
  if (!response.ok) throw new Error(`${path} returned HTTP ${response.status} (${url})`);
  return { response, url };
}

async function loadInvitationConfig() {
  const resource = await fetchResource("wedding_party.json");
  INVITATION_CONFIG = await resource.response.json();
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[character]));
}

const WEATHER_CACHE = new Map();

const WEATHER_DESCRIPTIONS = {
  0: "Clear sky",
  1: "Mainly clear",
  2: "Partly cloudy",
  3: "Overcast",
  45: "Foggy",
  48: "Foggy",
  51: "Light drizzle",
  53: "Drizzle",
  55: "Heavy drizzle",
  61: "Light rain",
  63: "Rain",
  65: "Heavy rain",
  71: "Light snow",
  73: "Snow",
  75: "Heavy snow",
  80: "Light rain showers",
  81: "Rain showers",
  82: "Heavy rain showers",
  95: "Thunderstorms",
  96: "Thunderstorms with hail",
  99: "Thunderstorms with hail",
};

const WEATHER_ICONS = {
  clear: "☼",
  cloudy: "☁",
  rain: "☂",
  snow: "❄",
  storm: "⚡",
};

function weatherIcon(code) {
  if (code >= 95) return WEATHER_ICONS.storm;
  if (code >= 71 && code <= 77) return WEATHER_ICONS.snow;
  if (code >= 51 && code <= 82) return WEATHER_ICONS.rain;
  if (code >= 1 && code <= 3) return WEATHER_ICONS.cloudy;
  return WEATHER_ICONS.clear;
}

function formatTemperature(value) {
  return `${Math.round(value)}°F`;
}

function daysFromToday(date) {
  const today = new Date(`${new Date().toISOString().slice(0, 10)}T12:00:00Z`);
  const target = new Date(`${date}T12:00:00Z`);
  return Math.round((target - today) / 86400000);
}

async function getWeather(zip, date) {
  const cacheKey = `${zip}:${date}`;
  if (WEATHER_CACHE.has(cacheKey)) return WEATHER_CACHE.get(cacheKey);

  const daysAway = daysFromToday(date);
  if (daysAway < 0) throw new Error("Forecasts are no longer available for this date");
  if (daysAway > 16) throw new Error("Forecast will be available closer to the event date");

  const geocodeUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(zip)}&count=1&language=en&format=json`;
  const geocodeResponse = await fetch(geocodeUrl, { cache: "no-store" });
  if (!geocodeResponse.ok) throw new Error("Location lookup unavailable");
  const geocode = await geocodeResponse.json();
  const location = geocode.results?.[0];
  if (!location) throw new Error(`ZIP code ${zip} could not be located`);

  const params = new URLSearchParams({
    latitude: location.latitude,
    longitude: location.longitude,
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_gusts_10m_max",
    temperature_unit: "fahrenheit",
    wind_speed_unit: "mph",
    timezone: "auto",
    start_date: date,
    end_date: date,
    forecast_days: "16",
  });
  const forecastResponse = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`, { cache: "no-store" });
  if (!forecastResponse.ok) throw new Error("Weather forecast unavailable");
  const forecast = await forecastResponse.json();
  const daily = forecast.daily;
  const weather = {
    icon: weatherIcon(daily.weather_code?.[0]),
    description: WEATHER_DESCRIPTIONS[daily.weather_code?.[0]] || "Forecast available",
    high: formatTemperature(daily.temperature_2m_max?.[0]),
    low: formatTemperature(daily.temperature_2m_min?.[0]),
    rain: daily.precipitation_probability_max?.[0],
    gusts: daily.wind_gusts_10m_max?.[0],
  };
  WEATHER_CACHE.set(cacheKey, weather);
  return weather;
}

function weatherMarkup(event) {
  return `<div class="weather-strip is-pending" data-weather-date="${escapeHtml(event.weatherDate)}" data-weather-zip="${escapeHtml(event.weatherZip)}">Loading forecast...</div>`;
}

async function hydrateWeather() {
  const strips = document.querySelectorAll("[data-weather-date]");
  await Promise.all([...strips].map(async strip => {
    const date = strip.dataset.weatherDate;
    const zip = strip.dataset.weatherZip;
    try {
      const weather = await getWeather(zip, date);
      strip.classList.remove("is-pending");
      strip.innerHTML = `<span class="weather-icon" aria-hidden="true">${weather.icon}</span>${weather.description} · ${weather.high} / ${weather.low} · ${weather.rain}% chance of rain · gusts to ${Math.round(weather.gusts)} mph`;
    } catch (error) {
      strip.classList.remove("is-pending");
      strip.classList.add("is-unavailable");
      strip.textContent = error.message === "Failed to fetch"
        ? "Forecast unavailable right now. Please check again later."
        : error.message;
    }
  }));
}

function inlineMarkdown(value) {
  let html = escapeHtml(value);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
    '<img class="day-image" src="$2" alt="$1">');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

async function loadThankYou() {
  const resource = await fetchResource("thank-you.md");
  const text = await resource.response.text();
  const paragraphs = text.trim().split(/\r?\n\s*\r?\n/);
  document.getElementById("thankYou").innerHTML = paragraphs
    .filter(paragraph => paragraph.trim())
    .map(paragraph => `<p>${inlineMarkdown(paragraph.replace(/\r?\n/g, " "))}</p>`)
    .join("");
}

function parseFrontMatter(text) {
  const match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  if (!match) throw new Error("Event markdown is missing front matter");

  const metadata = {};
  match[1].split(/\r?\n/).forEach(line => {
    const separator = line.indexOf(":");
    if (separator === -1) return;
    metadata[line.slice(0, separator).trim()] = line.slice(separator + 1).trim();
  });
  return { metadata, body: match[2] };
}

function markdownEvent(text, role, eventFile) {
  const { metadata, body } = parseFrontMatter(text);
  const eventKey = eventFile.replace(/\.md$/, "");
  const roleConfig = INVITATION_CONFIG.roles?.[role];
  if (!roleConfig || !roleConfig.events.includes(eventKey)) return null;

  const visibleLines = [];
  let roleBlock = false;
  let roleBlockAllowed = false;
  body.split(/\r?\n/).forEach(line => {
    const roleStart = line.match(new RegExp("^" + "<" + "!-- roles: (.+) -->$"));
    if (roleStart) {
      roleBlock = true;
      roleBlockAllowed = roleStart[1].split(",").map(roleName => roleName.trim()).includes(role);
      return;
    }
    if (line.trim() === "<!-- /roles -->") {
      roleBlock = false;
      roleBlockAllowed = false;
      return;
    }
    if (!roleBlock || roleBlockAllowed) visibleLines.push(line);
  });

  let inDetails = false;
  let inMenu = false;
  let paragraph = [];
  const intro = [];
  const rows = [];
  const notes = [];
  const menuItems = [];
  const flushParagraph = () => {
    if (!paragraph.length) return;
    if (inMenu) menuItems.push(inlineMarkdown(paragraph.join(" ")));
    else {
      const html = `<p>${inlineMarkdown(paragraph.join(" "))}</p>`;
      (inDetails ? notes : intro).push(html);
    }
    paragraph = [];
  };

  visibleLines.forEach(line => {
    if (line.trim() === "## Details") {
      flushParagraph();
      inDetails = true;
      inMenu = false;
      return;
    }
    if (line.trim() === "## Menu") {
      flushParagraph();
      inDetails = false;
      inMenu = true;
      return;
    }
    if (inMenu) {
      const menuItem = line.match(/^[-*]\s+(.+)$/);
      if (menuItem) {
        flushParagraph();
        menuItems.push(inlineMarkdown(menuItem[1]));
        return;
      }
    }
    const row = line.match(/^[-*]\s+\*\*([^*]+):\*\*\s*(.+)$/);
    if (row && inDetails) {
      flushParagraph();
      rows.push({ label: row[1], value: inlineMarkdown(row[2]) });
      return;
    }
    if (!line.trim()) {
      flushParagraph();
      return;
    }
    if (line.trim().startsWith("![")) {
      flushParagraph();
      intro.push(inlineMarkdown(line.trim()));
      return;
    }
    paragraph.push(line.trim());
  });
  flushParagraph();

  return {
    ...metadata,
    introHtml: intro.join(""),
    rows,
    menuHtml: menuItems.length ? `<ul>${menuItems.map(item => `<li>${item}</li>`).join("")}</ul>` : "",
    noteHtml: notes.join(""),
    variant: metadata.variant || "",
  };
}

function dayCard({ title, date, introHtml, rows, menuHtml, noteHtml, variant = "", weatherDate, weatherZip }) {
  const imageMatch = introHtml.match(/<img class="day-image"[^>]+>/);
  const imageHtml = imageMatch ? imageMatch[0] : "";
  const textHtml = imageHtml ? introHtml.replace(imageHtml, "") : introHtml;
  const rowsHtml = rows.map(r => `
    <div class="detail-row">
      <span class="label">${r.label}</span>
      <span class="fill"></span>
      <span class="value">${r.value}</span>
    </div>`).join("");
  return `
    <div class="day-card ${variant}">
      <h2>${title}</h2>
      <p class="date">${date}</p>
      <div class="day-content">
        ${imageHtml}
        <div class="desc day-intro">${textHtml}</div>
      </div>
      <div class="details">
        <h3>Details</h3>
        ${rowsHtml}
        ${menuHtml ? `<div class="menu-sub-block"><h4>Menu</h4>${menuHtml}</div>` : ""}
        <div class="weather-sub-block">
          <h4>Forecast</h4>
          ${weatherMarkup({ weatherDate, weatherZip })}
        </div>
        ${noteHtml ? `<div class="note">${noteHtml}</div>` : ""}
      </div>
    </div>`;
}

async function loadEvents() {
  const manifestResource = await fetchResource("events/events.json");
  const files = await manifestResource.response.json();
  EVENTS = await Promise.all(files.map(async file => {
    const resource = await fetchResource(`events/${file}`);
    return { file, text: await resource.response.text() };
  }));
}

function buildItinerary(role) {
  return EVENTS
    .map(event => markdownEvent(event.text, role, event.file))
    .filter(Boolean)
    .map(event => dayCard(event))
    .join("");
}

function buildOverview(role) {
  const rows = EVENTS
    .map(event => markdownEvent(event.text, role, event.file))
    .filter(Boolean)
    .map(event => `
      <div class="overview-row">
        <span class="overview-date"><strong>${escapeHtml(event.overviewDay)}</strong>, ${escapeHtml(event.overviewDate)}</span>
        <span class="overview-fill"></span>
        <span class="overview-title">${escapeHtml(event.overviewTitle)}</span>
      </div>`)
    .join("");

  return `
    <section class="overview" aria-labelledby="overview-title">
      <h2 id="overview-title">Overview</h2>
      ${rows}
    </section>`;
}

function render(guest) {
  const results = document.getElementById("results");
  const label = INVITATION_CONFIG.roles?.[guest.role]?.label || guest.role;

  results.innerHTML = `
    <hr class="rule">
    <p class="greeting">Hi ${guest.name}</p>
    <p class="greeting-sub">Here's your weekend &mdash; you're joining us as ${label}.</p>
    ${buildOverview(guest.role)}
    ${buildItinerary(guest.role)}
    <div class="reset-row"><button id="resetBtn">Look up a different name</button></div>
  `;
  hydrateWeather();
  document.getElementById("resetBtn").addEventListener("click", () => {
    results.innerHTML = "";
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").classList.remove("notfound");
    document.getElementById("guestSearch").value = "";
    document.getElementById("guestSelect").selectedIndex = 0;
    updateGuestMatches();
    document.getElementById("guestSearch").focus();
  });
}

function findGuest() {
  const select = document.getElementById("guestSelect");
  const feedback = document.getElementById("feedback");
  const query = normalize(select.value);

  if (!query) {
    feedback.textContent = "Type your name to get started.";
    feedback.classList.remove("notfound");
    return;
  }

  const match = GUESTS.find(g => normalize(g.name) === query);

  if (match) {
    feedback.textContent = "";
    feedback.classList.remove("notfound");
    render(match);
  } else {
    feedback.textContent = "We couldn't find that name on the list — double check the spelling, or reach out to Jessie or Jude directly.";
    feedback.classList.add("notfound");
    document.getElementById("results").innerHTML = "";
  }
}

document.getElementById("findBtn").addEventListener("click", findGuest);
document.getElementById("guestSearch").addEventListener("input", updateGuestMatches);
document.getElementById("guestSelect").addEventListener("change", (event) => {
  document.getElementById("findBtn").disabled = !event.target.value;
});

const contentLoaders = [
  ["Guest list", loadGuests],
  ["Invitation config", loadInvitationConfig],
  ["Event content", loadEvents],
  ["Thank-you letter", loadThankYou],
];

Promise.allSettled(contentLoaders.map(([, loader]) => loader())).then(results => {
  const failures = results
    .map((result, index) => result.status === "rejected" ? `${contentLoaders[index][0]}: ${result.reason.message}` : null)
    .filter(Boolean);
  if (failures.length) {
    document.getElementById("feedback").innerHTML = `
      <div class="load-error">
        <strong>Couldn't load the page content.</strong>
        <p>Deployment diagnostics:</p>
        <ul>${failures.map(failure => `<li>${escapeHtml(failure)}</li>`).join("")}</ul>
        <p>Confirm these files are published from the same GitHub Pages source as index.html.</p>
      </div>`;
  }
});
</script>
